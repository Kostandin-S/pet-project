services:
  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - user-service
      - book-service
      - user-books-service
    env_file:
      - ./api-gateway/.env.staging

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    ports:
      - "3001:3001"
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./auth-service/.env.staging

  user-service:
    build:
      context: ./user-service
    container_name: user-service
    ports:
      - "3002:3002"
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./user-service/.env.staging

  book-service:
    build:
      context: ./book-service
    container_name: book-service
    ports:
      - "3003:3003"
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./book-service/.env.staging

  user-books-service:
    build:
      context: ./user-books-service
    container_name: user-books-service
    ports:
      - "3004:3004"
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./user-books-service/.env.staging

  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    ports:
      - "3005:3005"
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./notification-service/.env.staging

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 3s
      retries: 10
