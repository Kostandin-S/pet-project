name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  build-and-push-prod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push API Gateway
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/book-tracker-microservices-api-gateway:latest ./api-gateway
          docker push ${{ secrets.DOCKER_USERNAME }}/book-tracker-microservices-api-gateway:latest

      - name: Build & Push Auth Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/book-tracker-microservices-auth-service:latest ./auth-service
          docker push ${{ secrets.DOCKER_USERNAME }}/book-tracker-microservices-auth-service:latest

      - name: Build & Push User Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/book-tracker-microservices-user-service:latest ./user-service
          docker push ${{ secrets.DOCKER_USERNAME }}/book-tracker-microservices-user-service:latest

      - name: Build & Push Book Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/book-tracker-microservices-book-service:latest ./book-service
          docker push ${{ secrets.DOCKER_USERNAME }}/book-tracker-microservices-book-service:latest

      - name: Build & Push User Books Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/book-tracker-microservices-user-books-service:latest ./user-books-service
          docker push ${{ secrets.DOCKER_USERNAME }}/book-tracker-microservices-user-books-service:latest

      - name: Build & Push Notification Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/book-tracker-microservices-notification-service:latest ./notification-service
          docker push ${{ secrets.DOCKER_USERNAME }}/book-tracker-microservices-notification-service:latest
