name: Push Dev Docker Images

on:
  push:
    branches:
      - dev

jobs:
  build-and-push-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push API Gateway
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/book-tracker-microservices-api-gateway:dev ./api-gateway
          docker push ${{ secrets.DOCKER_USERNAME }}/book-tracker-microservices-api-gateway:dev

      - name: Build & Push Auth Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/book-tracker-microservices-auth-service:dev ./auth-service
          docker push ${{ secrets.DOCKER_USERNAME }}/book-tracker-microservices-auth-service:dev

      - name: Build & Push User Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/book-tracker-microservices-user-service:dev ./user-service
          docker push ${{ secrets.DOCKER_USERNAME }}/book-tracker-microservices-user-service:dev

      - name: Build & Push Book Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/book-tracker-microservices-book-service:dev ./book-service
          docker push ${{ secrets.DOCKER_USERNAME }}/book-tracker-microservices-book-service:dev

      - name: Build & Push User Books Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/book-tracker-microservices-user-books-service:dev ./user-books-service
          docker push ${{ secrets.DOCKER_USERNAME }}/book-tracker-microservices-user-books-service:dev

      - name: Build & Push Notification Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/book-tracker-microservices-notification-service:dev ./notification-service
          docker push ${{ secrets.DOCKER_USERNAME }}/book-tracker-microservices-notification-service:dev
