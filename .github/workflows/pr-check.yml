name: PR Check - Build & Lint

on:
  pull_request:
    branches:
      - dev

jobs:
  check-all-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - book-service
          - user-books-service
          - notification-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: cd ${{ matrix.service }} && npm ci

      - name: Build
        run: cd ${{ matrix.service }} && npm run build

      - name: Lint
        run: cd ${{ matrix.service }} && npm run lint
