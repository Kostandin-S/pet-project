apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: docker.io/kostandins/book-tracker-microservices-auth-service:latest
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: prod
            - name: PORT
              value: "3001"
            - name: SESSION_SECRET
              value: it-is-super-secret-session-secret
            - name: DATABASE_URL
              value: postgresql://postgres.juiqpttgxazecbcliibr:6m2QBHnQpmwpZMb9@aws-0-eu-central-1.pooler.supabase.com:5432/postgres?schema=auth_service
            - name: JWT_SECRET
              value: fell-in-love-with-an-alien
            - name: USER_SERVICE_URL
              value: http://user-service:3002
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672
            - name: QUEUE_USER_DELETED
              value: user_deleted_queue
