apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: docker.io/kostandins/book-tracker-microservices-auth-service:latest
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: prod
            - name: PORT
              value: "3001"
