apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: docker.io/kostandins/book-tracker-microservices-api-gateway:dev
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: dev
            - name: PORT
              value: "3000"
