apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: book-service
  template:
    metadata:
      labels:
        app: book-service
    spec:
      containers:
        - name: book-service
          image: docker.io/kostandins/book-tracker-microservices-book-service:dev
          ports:
            - containerPort: 3003
          env:
            - name: NODE_ENV
              value: dev
            - name: PORT
              value: "3003"
