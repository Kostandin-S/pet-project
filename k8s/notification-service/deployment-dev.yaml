apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: docker.io/kostandins/book-tracker-microservices-notification-service:dev
          ports:
            - containerPort: 3005
          env:
            - name: NODE_ENV
              value: dev
            - name: PORT
              value: "3005"
